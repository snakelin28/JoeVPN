# ============================================================
#  JoeVPN  -  config.conf
#  所有可配置参数。首次安装：凭据留空 -> 脚本自动生成并写回本文件。
#  换 VPS 想复用同一套节点：把生成好的凭据留着即可。
# ============================================================

# ---------------- 端口 ----------------
REALITY_PORT=443           # VLESS Reality (TCP)
HY2_PORT=8443              # Hysteria2 (UDP)

# ---------------- Reality ----------------
# 偷跑目标站：必须真实存在、支持 TLS1.3、且平时你不会访问。
# www.cloudflare.com 被用烂了，建议换成不常见的干净站点（如某企业官网）。
REALITY_SNI="www.cloudflare.com"
REALITY_HANDSHAKE_SERVER="www.cloudflare.com"
REALITY_HANDSHAKE_PORT=443

# ---------------- Hysteria2 ----------------
HY2_SNI="vpn.joe"          # 自签证书的域名，随便填；客户端需 insecure=1

# ---------------- 凭据（留空=自动生成，首次务必留空）----------------
UUID=""
REALITY_PRIVATE_KEY=""
REALITY_PUBLIC_KEY=""
REALITY_SHORT_ID=""
HY2_PASSWORD=""

# ---------------- 带宽模式 ----------------
# adaptive : 服务端 ignore_client_bandwidth + BBR 自适应（推荐，流媒体最稳）
# fixed    : 固定带宽（需设置下面两个值，仅在明确知道链路上限时用）
HY2_BANDWIDTH_MODE="adaptive"
HY2_UP_MBPS=30
HY2_DOWN_MBPS=100

# ---------------- 客户端 ----------------
CLIENT_NAME="JoeVPN"       # 节点名前缀

# ---------------- 自托管订阅服务 ----------------
ENABLE_SUB_SERVER=1        # 1=安装完自动起订阅服务并出链接+二维码
SUB_PORT=6060              # 订阅服务端口（记得同步 Lightsail 控制台防火墙）
SUB_TOKEN=""               # 随机路径，留空自动生成并写回；换 VPS 保留可复用同一链接路径

# ---------------- 系统优化开关 ----------------
ENABLE_BBR=1               # 开 BBR 拥塞控制
ENABLE_IP_FORWARD=1        # 开 IPv4/IPv6 转发
ENABLE_NET_TUNE=1          # QUIC/TCP 缓冲区、流媒体长连接优化
ENABLE_MEM_TUNE=1          # 按内存自适应（小内存自动建 swap）

# ---------------- sing-box 版本 ----------------
# 留空=每次装最新稳定版。若哪天新版改了配置格式导致启动失败，
# 在这里填一个确认能用的版本号（如 1.12.0）重跑即可。
SB_VERSION=""

# ---------------- 路径（一般不用改）----------------
SB_CONFIG_DIR="/etc/sing-box"
SB_CERT_DIR="/etc/sing-box/certs"
SB_DATA_DIR="/var/lib/sing-box"
SB_BIN="/usr/bin/sing-box"
